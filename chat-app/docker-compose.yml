version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile  # Il Dockerfile del backend Python
    ports:
      - "5000:5000"
    depends_on:
      - ollama
    networks:
      - chatnet

  ollama:
    build:
      context: ./backend
      dockerfile: Dockerfile.ollama  # Nuovo nome chiaro
    ports:
      - "11434:11434"
    networks:
      - chatnet

networks:
  chatnet:
